###########################################################
# /etc/rdxd.conf 
#
# Configuration file for rdxd.
###########################################################


#TODO: document this

[rdxd]
AutoUpload=false

# CONTEXTLOG
#
# This section contains files that provide
# contextual information to a crash report, but
# are not indicative of a crash themselves.  For
# instance logs serve this purpose.
#
# When rdxd detects a crash it will run each of the
# following scripts passing a path to the desired 
# output.  The script must produce a file at the provided
# path.

[CONTEXTLOG=sysinfo.txt]
LogFormat=text, indexed
MakeLogScript=/usr/lib/rdxd/make_sysinfo.sh

[CONTEXTLOG=syslog.txt]
LogFormat=text, indexed
MakeLogScript=/usr/lib/rdxd/dumplog.sh 40000 /var/log/messages

[CONTEXTLOG=fsck.txt]
LogFormat=text, indexed
MakeLogScript=/usr/lib/rdxd/dumplog.sh 10000 /var/log/fsck.log

[CONTEXTLOG=manifest.txt]
LogFormat=text, indexed
MakeLogScript=/usr/lib/rdxd/make_manifest.sh

[CONTEXTLOG=dmesg.txt]
LogFormat=text, non-indexed
MakeLogScript=/usr/lib/rdxd/make_kernel.sh

[CONTEXTLOG=lunasysmgr.log]
LogFormat=text, non-indexed
MakeLogScript=/usr/lib/rdxd/dumplog.sh 10000 /var/log/lunasysmgr.log

#Commented out until we have a server side tool to
#analyse this data
#[CONTEXTLOG=integcheck.txt]
#LogFormat=text, non-indexed
#MakeLogScript=/usr/lib/rdxd/make_integcheck.sh

[CONTEXTLOG=preboot.log]
LogFormat=text, non-indexed
MakeLogScript=/usr/lib/rdxd/make_preboot.sh

