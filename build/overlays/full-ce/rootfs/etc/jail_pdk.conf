# pdk app type
# application dir:
set APPDIR = /media/cryptofs/apps/usr/palm/applications/$APPID
# jail dir:
set JAILDIR = /var/palm/jail

include jail_device.conf

# commands:

# add jail user to the right groups:
groups video,pulse-access,luna
# setup mount points
mkdir /usr
mkdir /usr/palm
mkdir /usr/palm/services
# /tmp setup 
mount rw /tmp
chmod 777 /tmp/NAppMgrSocket
chmod 777 /tmp/pipcserver.sysmgr
mkdir /var
chown /var 0 0
chmod 1777 /tmp
link /tmp /var/tmp

# /
chown / 0 0
chmod 755 /
# mount things
mount ro /lib
mount ro /bin
mount ro /usr/bin
mount ro /usr/lib
mount ro /usr/palm/frameworks
mount ro /usr/share
mount rw /proc

mkdir /usr/plugins
mount ro /usr/plugins

mkdir /dev
mkdir /dev/input
mount ro /dev/input
copynod /dev/urandom
chmod 666 /dev/urandom
if $do_snd == true
        mount rw /dev/snd
endif
if $emulator != true
	copynod /dev/video0
	chmod 660 /dev/video0
	chown /dev/video0 0 44
	link /dev/video0 /dev/video
endif
copynod /dev/fb0
chmod 660 /dev/fb0
chown /dev/fb0 0 44
if $emulator != true
	copynod /dev/fb1
	chmod 660 /dev/fb1
	chown /dev/fb1 0 44
endif
copynod /dev/console
chmod 666 /dev/console
if $do_pvr
        copynod /dev/pvrsrvkm 
        chmod 660 /dev/pvrsrvkm
        chown /dev/pvrsrvkm 0 44
endif
chmod 777 /dev/shm
mount rw /dev/shm
mount ro /etc/ssl
mkdir /var/ssl
mount ro /var/ssl/trustedcerts
mount ro /var/ssl/certs
mount ro /var/ssl/crl

# jail log
if $MODE == runtime
        system test -f /dev/logdir/log || ln /dev/log /dev/logdir/log
endif
mount ro /dev/logdir
if $MODE == delete
        system rm -f /dev/logdir/log
endif
link /dev/logdir/log /dev/log
chown /dev/logdir/log 0 5000
chmod 660 /dev/logdir/log
chown /dev/log 0 5000
chmod 660 /dev/log

# tokens now mounted from real fs
system mkdir -p /var/palm/tokens; chmod 770 /var/palm/tokens; chown 0.5000 /var/palm/tokens       
mkdir /var
mkdir /var/palm
mount rw /var/palm/tokens

# nduid
if $do_nduid
        copynod /dev/nduid
        chmod 444 /dev/nduid
        chown /dev/nduid 0 44
endif

# heap
copynod /dev/heap
chown /dev/heap $UID 5000
chmod 700 /dev/heap

if $has_rbshared
	chown /tmp/rbSharedMemory $UID 5000
	chmod 666 /tmp/rbSharedMemory
endif

# pixi
if $do_kgsl
        copynod /dev/kgsl 
        chmod 660 /dev/kgsl
        chown /dev/kgsl 0 44
endif
# manta
if $kgsl_name
	copynod $kgsl_name
	chmod 660 $kgsl_name
	chown $kgsl_name 0 44
endif
if $do_msm
	copynod /dev/msm_aac
	chmod 660 /dev/msm_aac
	chown /dev/msm_aac 0 44
endif
if $do_msmrotate
	copynod /dev/msm_rotator
	chmod 660 /dev/msm_rotator
	chown /dev/msm_rotator 0 44
endif
if $do_msm_vid
	copynod /dev/msm_vidc_dec
	chmod 660 /dev/msm_vidc_dec
	chown /dev/msm_vidc_dec 0 44
endif

if $do_ondemandtcl
	copynod /dev/ondemandtcl0
	chmod 660 /dev/ondemandtcl0
	chown /dev/ondemandtcl0 0 44
endif
# topaz
if $kgsl_topaz_copy
	copynod /dev/kgsl-2d0
	chmod 660 /dev/kgsl-2d0
	chown /dev/kgsl-2d0 0 44
	copynod /dev/kgsl-2d1
	chmod 660 /dev/kgsl-2d1
	chown /dev/kgsl-2d1 0 44
	copynod /dev/kgsl-3d0
	chmod 660 /dev/kgsl-3d0
	chown /dev/kgsl-3d0 0 44
endif
if $pmem_smipool_copy
	copynod /dev/pmem_smipool
	chmod 660 /dev/pmem_smipool
	chown /dev/pmem_smipool 0 44
endif
if $do_adsp
	copynod /dev/pmem_adsp
	chmod 660 /dev/pmem_adsp
	chown /dev/pmem_adsp 0 44
endif


# /var/luna/preferences
mkdir /var/luna
mkdir /var/luna/preferences
# should be ro, but the ro remount fails
mount rw /var/luna/preferences

if $MODE == runtime
        system chmod a+r /dev/shm/pulse-shm-*
endif

# /etc
copy /etc/asound.conf
copy /etc/ld.so.cache
copy /etc/ld.so.preload
copy /etc/nsswitch.conf
mkdir /etc/pulse
copy /etc/pulse/client.conf
copy /etc/yamato_panel.txt
copy /etc/palm-build-info
mkdir /etc/prefs
copy /etc/prefs/public_properties
mount ro /etc/prefs/properties

# /media
mkdir /media
mkdir /media/cryptofs
mkdir /media/cryptofs/apps
mkdir /media/cryptofs/apps/usr
mkdir /media/cryptofs/apps/usr/palm
mkdir /media/cryptofs/apps/usr/palm/applications
mount rw /media/internal
mountappdir 
mount rw /var/run
# env 
setenv HOME $APPDIR
homedir $APPDIR
setrlimit CORE INF INF
setrlimit MEMLOCK INF INF
setrlimit NICE -2 -2


