# /etc/event.d/usbctl-watchd
#
# Upstart job for the USB control daemon (com.webosarchive.usbsettings).
# Starts once early boot has finished and /media/internal is mounted; respawns
# if it crashes. Runs as root, outside the app jail.

description "USB Control Watch Daemon"
author      "webOS Archive"

start on stopped rcS
stop on runlevel [06]

respawn

exec /usr/bin/usbctl-watchd
