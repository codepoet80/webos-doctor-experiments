<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	<title>Document Viewer</title>
	<!-- The Enyo CARD. It runs in the STOCK webOS webview (WebKit ~2009): fine for the
	     zero-dependency text/image renderers, but NOT for PDF.js/mammoth/SheetJS, which
	     need a modern JS engine. Those formats are handed off to Atlas (WPE, modern JS)
	     via the render/ harness. See docviewer/README.md. -->
	<script src="/usr/palm/frameworks/enyo/0.10/framework/enyo.js" type="text/javascript"></script>
	<link href="stylesheets/doc-viewer.css" media="screen" rel="stylesheet" type="text/css" />
</head>
<body>
	<script type="text/javascript">
		new DocViewer().renderInto(document.body);
	</script>
</body>
</html>
