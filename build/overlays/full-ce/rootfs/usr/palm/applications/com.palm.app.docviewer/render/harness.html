<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Document Viewer (Atlas)</title>
	<!--
	  MODERN-JS RENDER HARNESS. This page is NOT loaded by the app card - it is opened in
	  Atlas (org.webosports.app.atlas, simple mode = WPE WebKit, modern JS), where PDF.js /
	  mammoth / SheetJS actually run. The card hands us a document via query string:

	      harness.html?type=pdf&file=/media/internal/.qo/123-report.pdf&name=report.pdf

	  We XHR the local file as an ArrayBuffer and feed it to the vendored library. If the
	  library is not present in ../lib, we say so instead of white-screening. VIEW-ONLY.

	  FILE-ACCESS CAVEAT: this page is loaded over file:// and XHRs another file:// URL. Most
	  WebKit/WPE builds allow file->file XHR (same scheme), but if the build enforces strict
	  same-origin for file://, the read is blocked. See lib/README.md and docviewer/README.md
	  for the WPE flag / co-location workaround.
	-->
	<link rel="stylesheet" href="harness.css" />
</head>
<body>
	<div id="bar">
		<span id="title">Document Viewer</span>
		<span id="status"></span>
	</div>
	<div id="stage"></div>
	<script src="harness.js"></script>
</body>
</html>
