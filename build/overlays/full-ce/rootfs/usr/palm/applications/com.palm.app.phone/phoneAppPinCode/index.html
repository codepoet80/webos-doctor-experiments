<html>

	</head>
	<body class="pinCardBackground">
		<script type="text/javascript">		
			try {
				new PhonePinCard().renderInto(document.body);
			} catch (e ) {
				document.write(JSON.stringify(e));
				throw e;
			}
			
                        if (!enyo.application.isTablet) {
			    enyo.setAllowedOrientation("up");
                        }
			
			// workaround for CFISH-3795: something (not sure what yet) is trying to close
			// this window. This should NEVER happen since sysmgr will crash.
			window.close = function() {
				try{throw e;}catch(e){ enyo.error("Warning (NOT AN EXCEPTION): tried to close PhoneAppPincode window. Stack: " + e.stack); }
			};
			
		</script>
	</body>
